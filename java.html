<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Projetos Java☕</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            box-sizing: border-box;
        }

        .container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 2.5rem;
            font-size: 2.5rem;
        }

        .project-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .project-card {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .project-card .icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .project-card h2 {
            font-size: 1.5rem;
            color: #2d3748;
            margin: 0 0 0.75rem 0;
        }

        .project-card p {
            font-size: 1rem;
            color: #718096;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        .project-card .button {
            display: inline-block;
            background-color: #667eea;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .project-card .button:hover {
            background-color: #5a67d8;
        }
        /* Estilo para o botão "voltar" */
        .btn-branco {
            display: inline-block;
            background-color: white; /* Fundo branco */
            color: #667eea; /* Texto na cor do tema */
            padding: 0.75rem 2rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); /* Sombra para destaque */
            border: 2px solid #667eea; /* Borda para combinar com o tema */
            margin-top: 1rem; /* Espaçamento superior */
        }

        .btn-branco:hover {
            background-color: #667eea; /* Inverte as cores no hover */
            color: white;
            transform: translateY(-3px); /* Efeito de leve levantamento */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .project-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
    <style>
        /* ===== Animação de abertura ===== */
        #preloader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity .6s ease, visibility .6s ease;
        }
        #preloader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #preloader .logo-intro {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(30px) scale(.7);
            filter: drop-shadow(0 10px 25px rgba(0,0,0,.3));
            animation: iconPop .8s cubic-bezier(.34,1.56,.64,1) forwards;
        }
        #preloader .logo-intro img {
            width: 100%;
            height: 100%;
        }
        #preloader .logo-intro::before {
            content: "";
            position: absolute;
            inset: -18px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.35);
            animation: ringPulse 1.8s ease-out infinite;
        }
        @keyframes iconPop {
            0%   { opacity: 0; transform: translateY(30px) scale(.7); }
            60%  { opacity: 1; transform: translateY(-6px) scale(1.15); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes ringPulse {
            0%   { transform: scale(.85); opacity: .9; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        #preloader .intro-text {
            margin-top: 1.5rem;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: .1em;
            text-align: center;
            opacity: 0;
            animation: textFade .7s ease forwards;
            animation-delay: .7s;
        }
        @keyframes textFade {
            to { opacity: .95; }
        }
        #preloader .loading-bar {
            width: 160px;
            height: 3px;
            background: rgba(255,255,255,.25);
            border-radius: 999px;
            margin: 14px auto 0;
            overflow: hidden;
        }
        #preloader .loading-bar span {
            display: block;
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 999px;
            animation: loadFill 1.2s ease forwards;
            animation-delay: .3s;
        }
        @keyframes loadFill {
            to { width: 100%; }
        }

        /* Entrada suave do conteúdo após o preloader sumir */
        .page-anim {
            opacity: 0;
            transform: translateY(20px);
        }
        body.loaded .page-anim {
            animation: pageRise .7s ease forwards;
        }
        @keyframes pageRise {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="text-center">
            <div class="logo-intro">
                <img src="https://skillicons.dev/icons?i=java" alt="Java">
            </div>
            <div class="intro-text">MEUS PROJETOS JAVA</div>
            <div class="loading-bar"><span></span></div>
        </div>
    </div>

    <div class="container page-anim" style="animation-delay:.1s">
        <h1>Meus Projetos Java☕ </h1>
        <div class="project-grid">

            <div class="project-card">
                <div class="icon">⏳</div>
                <h2>Em breve...</h2>
                <p>em breve posto os meus projetos em Java⏳ </p>
                <a href="index.html" class="button">Abrir Projeto</a>
            </div>

            <div class="project-card">
                <div class="icon">⏳</div>
                <h2>Em breve...</h2>
                <p>em breve posto os meus projetos em Java⏳ </p>
                <a href="index.html" class="button">Abrir Projeto</a>
            </div>

        </div>
    </div>
    <div class="page-anim" style="animation-delay:.25s">
        <a class="btn-branco" href="index.html">Voltar</a>
    </div>

    <script>
        window.addEventListener('load', function () {
            var preloader = document.getElementById('preloader');
            setTimeout(function () {
                preloader.classList.add('hide');
                document.body.classList.add('loaded');
            }, 1000);
        });
    </script>

</body>
</html>
