<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Página não encontrada | Rubens Gabriel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{height:100%;}

  .bg-404{
    background:
      radial-gradient(circle at 18% 15%, rgba(255,255,255,0.06), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.05), transparent 45%),
      linear-gradient(150deg, #1a1a1a 0%, #2d2d2d 55%, #0a0a0a 100%);
  }

  .num{
    font-size: clamp(6rem, 22vw, 13rem);
    line-height: .85;
    font-weight: 800;
    letter-spacing: -0.04em;
    background: linear-gradient(120deg, #ffffff 0%, #9ca3af 55%, #4b5563 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .foto-wrap{
    position: relative;
    width: 190px;
    height: 254px;
  }

  .foto-wrap img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    border-radius: 1.25rem;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
  }

  .foto-wrap::after{
    content:"?";
    position:absolute;
    top:-18px;
    right:-14px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:#fff;
    color:#111827;
    font-weight:800;
    font-size:1.5rem;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    animation: balancar 2.6s ease-in-out infinite;
  }

  @keyframes balancar{
    0%,100%{ transform: rotate(-6deg) translateY(0); }
    50%{ transform: rotate(6deg) translateY(-6px); }
  }

  @media (prefers-reduced-motion: reduce){
    .foto-wrap::after{ animation:none; }
  }

  .voltar-btn{
    transition: transform .2s ease, background-color .2s ease;
  }
  .voltar-btn:hover{
    transform: translateY(-2px);
  }
</style>
</head>
<body class="bg-404 text-white min-h-screen flex items-center justify-center px-6 py-16">

  <div class="max-w-4xl w-full grid md:grid-cols-[auto_1fr] gap-10 md:gap-14 items-center">

    <div class="flex justify-center md:justify-start">
      <div class="foto-wrap">
        <img src="404-foto.jpg" alt="Rubens Gabriel confuso procurando a página">
      </div>
    </div>

    <div class="text-center md:text-left">
      <p class="num">404</p>
      <h1 class="text-2xl md:text-3xl font-bold mb-3">Essa página deu erro de compilação.</h1>
      <p class="text-gray-400 text-lg mb-8 max-w-md mx-auto md:mx-0">
        Procurei em todos os diretórios e não encontrei o que você está buscando. Ela pode ter sido movida, renomeada ou nunca existiu.
      </p>

      <div class="flex flex-wrap gap-3 justify-center md:justify-start">
        <a href="index.html"
           class="voltar-btn inline-flex items-center gap-2 bg-white text-black px-7 py-3 rounded-full font-semibold hover:bg-gray-200">
          ← Voltar ao início
        </a>
        <a href="index.html#projects"
           class="voltar-btn inline-flex items-center gap-2 border-2 border-white/40 px-7 py-3 rounded-full font-semibold hover:bg-white hover:text-black">
          Ver projetos
        </a>
      </div>

      <p class="text-gray-600 text-xs mt-10">Erro 404 — recurso não encontrado no servidor.</p>
    </div>

  </div>

</body>
</html>
